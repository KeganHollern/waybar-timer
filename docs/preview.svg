<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title description">
  <title id="title">Waybar Timer</title>
  <desc id="description">A tea timer beside a centered clock, with a small End timer confirmation below it.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#33ccff"/>
      <stop offset="1" stop-color="#00ff99"/>
    </linearGradient>
  </defs>
  <rect width="900" height="250" rx="16" fill="#10121b"/>
  <path d="M24 77H876" stroke="#252b3b"/>
  <g font-family="monospace" font-size="14" font-weight="bold">
    <rect x="24" y="25" width="126" height="36" rx="12" fill="#171c29" stroke="url(#accent)" stroke-width="2"/>
    <text x="44" y="48" fill="#a6b0c6">1  2  3  4</text>
    <rect x="175" y="25" width="172" height="36" rx="12" fill="#171c29" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="196" cy="43" r="7" fill="none" stroke="#00ff99" stroke-width="1.6"/>
    <path d="M196 38V43L200 46" stroke="#00ff99" fill="none"/>
    <text x="213" y="48" fill="#00ff99">Tea · 04:32</text>
    <rect x="355" y="25" width="190" height="36" rx="12" fill="#171c29" stroke="url(#accent)" stroke-width="2"/>
    <text x="374" y="48" fill="#33ccff">16:30 | Sun, 25 Oct</text>
    <rect x="728" y="25" width="148" height="36" rx="12" fill="#171c29" stroke="url(#accent)" stroke-width="2"/>
    <text x="747" y="48" fill="#a6b0c6">CPU 8%  RAM 31%</text>
  </g>
  <g font-family="monospace">
    <rect x="139" y="82" width="244" height="108" rx="15" fill="#11111b" stroke="url(#accent)" stroke-width="2"/>
    <text x="153" y="106" fill="#ffffff" font-size="13" font-weight="bold">End timer?</text>
    <text x="153" y="128" fill="#9399aa" font-size="11">Tea · 04:32 left</text>
    <rect x="273" y="144" width="96" height="32" rx="9" fill="#271c27" stroke="#80505b"/>
    <text x="286" y="164" fill="#ff8888" font-size="11">End timer</text>
    <text x="26" y="227" fill="#69768f" font-size="13">$ waybar-timer 5m "Tea"</text>
    <text x="606" y="227" fill="#69768f" font-size="12">The clock stays centered.</text>
  </g>
</svg>
